<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>配布フォーム - sei0608 Minecraft Distribution Lab</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/upload.js" defer></script>
</head>
<body>
  <header>
    <h1>配布フォーム</h1>
    <nav>
      <a href="index.html">ホーム</a>
      <a href="mods.html">Mod</a>
      <a href="datapacks.html">データパック</a>
      <a href="resourcepacks.html">リソースパック</a>
      <a href="tools.html">ツール</a>
      <a href="upload.html">配布フォーム</a>
    </nav>
  </header>

  <main>
    <section>
      <h2 class="section-title">配布データ登録フォーム</h2>

      <label>
        種類：
        <select id="type">
          <option value="mod">Mod</option>
          <option value="datapack">データパック</option>
          <option value="resourcepack">リソースパック</option>
        </select>
      </label><br><br>

      <label>
        ID（英数字）：
        <input id="id" type="text" placeholder="example-mod">
      </label><br><br>

      <label>
        名前：
        <input id="name" type="text" placeholder="Example Mod">
      </label><br><br>

      <label>
        タグ（カンマ区切り）：
        <input id="tags" type="text" placeholder="combat, utility">
      </label><br><br>

      <label>
        説明：
        <textarea id="description" rows="4" placeholder="このModは～～～"></textarea>
      </label><br><br>

      <h3>バージョン情報</h3>

      <label>
        MCバージョン：
        <input id="mc_version" type="text" placeholder="1.20.1">
      </label><br><br>

      <label id="loader-label">
        Modローダー（Modのみ）：
        <input id="loader" type="text" placeholder="Fabric / Forge / NeoForge">
      </label><br><br>

      <label id="version-label">
        バージョン：
        <input id="version" type="text" placeholder="1.0.0">
      </label><br><br>

      <label>
        GitHub リリースタグ：
        <input id="release_tag" type="text" placeholder="v1.0.0">
      </label><br><br>

      <button id="generate-btn">JSON を生成</button>

      <h3>生成結果</h3>
      <textarea id="result" rows="15" cols="80"></textarea>
    </section>
  </main>
</body>
</html>
