<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツール - sei0608のマイクラ配布ラボ</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- JSZip (Zip生成用ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <header>
        <h1>sei0608のマイクラ配布ラボ</h1>
        <nav>
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="datapacks.html">データパック</a></li>
                <li><a href="mods.html">Mod</a></li>
                <li><a href="resourcepacks.html">リソースパック</a></li>
                <li><a href="worlds.html">ワールド</a></li>
                <li><a href="tools.html">ツール</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>自作ツール・データパック生成</h2>
        
        <div style="background-color: #1e1e1e; padding: 20px; border-radius: 6px; margin-top: 20px;">
            <h3>データパック雛形生成ツール</h3>
            <p style="margin-bottom: 20px; color: #aaa;">バージョンごとのフォルダ構造（functions / function）および MCMETA 形式（pack_format / min_max_format）を自動判別して出力します。</p>

            <form id="dp-generator-form">
                <div class="form-group">
                    <label for="dp-name">名前:</label>
                    <input type="text" id="dp-name" required placeholder="例: MyDatapack">
                </div>
                <div class="form-group">
                    <label for="dp-id">ID (半角英数字・アンダースコアのみ):</label>
                    <input type="text" id="dp-id" required placeholder="例: my_datapack" pattern="[a-z0-9_]+">
                </div>
                <div class="form-group">
                    <label for="dp-mcversion">MCバージョン指定:</label>
                    <select id="dp-mcversion">
                        <option value="26.2">26.2 (Format: 107.1 / function / min_max_format)</option>
                        <option value="26.1">26.1 (Format: 101.1 / function / min_max_format)</option>
                        <option value="1.21.11">1.21.11 (Format: 94.1 / function / min_max_format)</option>
                        <option value="1.21.9-1.21.10">1.21.9 – 1.21.10 (Format: 88.0 / function / min_max_format)</option>
                        <option value="1.21.7-1.21.8">1.21.7 – 1.21.8 (Format: 81 / function)</option>
                        <option value="1.21.6">1.21.6 (Format: 80 / function)</option>
                        <option value="1.21.5">1.21.5 (Format: 71 / function)</option>
                        <option value="1.21.4">1.21.4 (Format: 61 / function)</option>
                        <option value="1.21.2-1.21.3">1.21.2 – 1.21.3 (Format: 57 / function)</option>
                        <option value="1.21-1.21.1">1.21 – 1.21.1 (Format: 48 / functions)</option>
                        <option value="1.20.5-1.20.6">1.20.5 – 1.20.6 (Format: 41 / functions)</option>
                        <option value="1.20.3-1.20.4">1.20.3 – 1.20.4 (Format: 26 / functions)</option>
                        <option value="1.20.2">1.20.2 (Format: 18 / functions)</option>
                        <option value="1.20-1.20.1">1.20 – 1.20.1 (Format: 15 / functions)</option>
                        <option value="1.19.4">1.19.4 (Format: 12 / functions)</option>
                        <option value="1.19-1.19.3">1.19 – 1.19.3 (Format: 10 / functions)</option>
                        <option value="1.18.2">1.18.2 (Format: 9 / functions)</option>
                        <option value="1.18-1.18.1">1.18 – 1.18.1 (Format: 8 / functions)</option>
                        <option value="1.17-1.17.1">1.17 – 1.17.1 (Format: 7 / functions)</option>
                        <option value="1.16.2-1.16.5">1.16.2 – 1.16.5 (Format: 6 / functions)</option>
                        <option value="1.15-1.16.1">1.15 – 1.16.1 (Format: 5 / functions)</option>
                        <option value="1.13-1.14.4">1.13 – 1.14.4 (Format: 4 / functions)</option>
                        <option value="custom">カスタム（pack_formatを直接指定）</option>
                    </select>
                </div>

                <div class="form-group" id="custom-format-group" style="display: none;">
                    <label for="dp-custom-format">pack_format の数値を指定:</label>
                    <input type="number" step="0.1" id="dp-custom-format" placeholder="例: 107.1">
                </div>

                <div class="form-group">
                    <label for="dp-version">データパックバージョン:</label>
                    <input type="text" id="dp-version" required placeholder="例: 1.0.0">
                </div>
                <div class="form-group">
                    <label for="dp-description">説明:</label>
                    <textarea id="dp-description" rows="3" placeholder="データパックの説明"></textarea>
                </div>
                <button type="submit" class="btn-generate">Zipファイルを生成してダウンロード</button>
            </form>
        </div>
    </main>

    <script src="js/generator.js"></script>
</body>
</html>
