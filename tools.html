<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ツール - マイクラ配布ラボ sei0608</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/tools.js" defer></script>
</head>
<body>
  <header>
    <h1>ツール</h1>
    <nav>
      <a href="index.html">ホーム</a>
      <a href="mods.html">Mod</a>
      <a href="datapacks.html">データパック</a>
      <a href="resourcepacks.html">リソースパック</a>
      <a href="tools.html">ツール</a>
    </nav>
  </header>
  <main>
    <section>
      <h2 class="section-title">pack.mcmeta 生成</h2>

      <label>
        種類:
        <select id="pack-type">
          <option value="datapack">データパック</option>
          <option value="resourcepack">リソースパック</option>
        </select>
      </label>
      <br><br>

      <label>
        説明文（description）:
        <input id="pack-description" type="text" placeholder="パックの説明">
      </label>
      <br><br>

      <label>
        pack_format:
        <input id="pack-format" type="number" value="15">
      </label>
      <br><br>

      <button id="generate-btn">pack.mcmeta を生成</button>

      <h3>生成結果</h3>
      <textarea id="result" rows="10" cols="60"></textarea>
    </section>
  </main>
</body>
</html>
