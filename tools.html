<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データパック ZIP 作成 - sei0608 Minecraft Distribution Lab</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="assets/js/datapack_zip.js" defer></script>
</head>
<body>
  <header>
    <h1>データパック ZIP 作成</h1>
    <nav>
      <a href="index.html">ホーム</a>
      <a href="mods.html">Mod</a>
      <a href="datapacks.html">データパック</a>
      <a href="resourcepacks.html">リソースパック</a>
      <a href="tools.html">データパック ZIP 作成</a>
    </nav>
  </header>

  <main>
    <section>
      <h2 class="section-title">データパック ZIP 自動生成</h2>

      <label>
        名前：
        <input id="name" type="text" placeholder="ExampleDatapack">
      </label><br><br>

      <label>
        ID（英数字）：
        <input id="id" type="text" placeholder="example_datapack">
      </label><br><br>

      <label>
        MCバージョン：
        <input id="mc_version" type="text" placeholder="1.20.1">
      </label><br><br>

      <label>
        データパックバージョン：
        <input id="dp_version" type="text" placeholder="1.0.0">
      </label><br><br>

      <label>
        説明：
        <input id="description" type="text" placeholder="このデータパックは～～～">
      </label><br><br>

      <button id="generate-btn">ZIP を生成</button>

      <h3>生成ログ</h3>
      <textarea id="log" rows="10" cols="80"></textarea>
    </section>
  </main>
</body>
</html>
